name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint with Ruff
        run: ruff check . --select E9,F63,F7,F82 --output-format=github

      - name: Byte-compile every Python file
        run: python -m compileall -q .

      - name: Smoke-import the application
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          JWT_SECRET_KEY: "ci-test-key-not-for-production-use"
        run: python -c "import app; print('App imported OK; blueprints:', [bp.name for bp in app.app.blueprints.values()])"

  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "::warning::Lint reported issues - review the log"
        continue-on-error: true

      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: "http://127.0.0.1:5000"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
